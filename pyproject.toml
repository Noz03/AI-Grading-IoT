[project]
name = "ai-grading-iot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Noz03", email = "duyhoangjs@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.15,<2",
    "argon2-cffi>=25.1,<26",
    "email-validator>=2.2,<3",
    "fastapi>=0.141.1",
    "google-genai>=2.25.0",
    "groq>=1.7.0",
    "pillow>=11,<13",
    "psycopg[binary]>=3.2,<4.0",
    "pydantic>=2.13.5",
    "pyjwt>=2.10,<3",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.20,<1",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.53.0",
]

[project.optional-dependencies]
vision = ["ultralytics>=8.3,<9"]

[project.scripts]
ai-grading-iot = "ai_grading_iot:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=9.1.1",
]
